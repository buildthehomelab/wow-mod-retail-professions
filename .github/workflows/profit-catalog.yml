name: Profit catalog
on: [push, pull_request, workflow_dispatch]
# A newer push to the same pull request or branch cancels the older run still queued or running
concurrency:
  group: profit-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tools/profit_catalog_test.lua addon/RetailProfessions
